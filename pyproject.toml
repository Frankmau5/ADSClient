[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adsclient"
version = "1.0.0"
description = "Cross-platform NTFS Alternate Data Stream (ADS) and Extended Attribute CLI & GUI tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
gui = [
    "flet>=0.21.0",
]

[project.scripts]
adsclient = "main:main"
